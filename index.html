<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>
        <link rel="stylesheet" href="style.css" />
        <script src="./libs/d3.v7.js"></script>
        <script src="./script.js"></script>
        <script src="./idioms/forceDirectedGraph.js"></script>
        <script src="./idioms/timeLineChart.js"></script>
        <script src="./idioms/butterflyChart.js"></script>
    </head>
    <body onload="init()">
        <div class="container">
            <div class="title">
                <h1 class="graph-title">
                    Visualizing Relationships in Ancient Greek Literature
                </h1>
            </div>
            <div class="ForceDirectedGraph">
                <div class="info-box">
  <strong>About this diagram:</strong><br>
  The network shows co-mentions of mythological figures across Greek literature.
  Node color indicates mythological origin; edge thickness reflects the normalized frequency of their co-appearances.
</div>

            </div>
            <div class="TimelineChart"></div>
            <div class="ButterflyChart">
                <div class="controls">
                    <label for="data-select">View by:</label>
                    <select id="data-select">
                        <option value="gender_by_author" selected>
                            Author
                        </option>
                        <option value="gender_by_type">
                            Character Type
                        </option>
                        <option value="domains_grouped_by_gender">
                            Domain
                        </option>
                        
                    </select>
                </div>
            </div>
        </div>
    </body>
</html>
