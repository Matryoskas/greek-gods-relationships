<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title></title>
        <link rel="stylesheet" href="style.css" />
        <script src="./libs/d3.v7.js"></script>
        <script src="./script.js"></script>
        <script src="./idioms/forceDirectedGraph.js"></script>
        <script src="./idioms/timeLineChart.js"></script>
        <script src="./idioms/butterflyChart.js"></script>
    </head>
    <body onload="init()">
        <div class="container">
            <div class="title">
                <h1 class="graph-title">

                    </select>

            </div>
        </div>
